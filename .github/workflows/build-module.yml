name: Build Dolibarr Module

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty to use module version)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: the version bump below pushes to main, and GitHub
          # refuses a push coming from a shallow clone.
          fetch-depth: 0

      - name: Get module version
        id: version
        # Never interpolate a GitHub expression straight into the shell: a tag
        # name may contain backticks, dollar-parens and semicolons, which would
        # run as code in this job. Everything goes through the environment.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "${REF#refs/tags/v}" != "$REF" ]; then
            VERSION="${REF_NAME#v}"
          else
            # Extract version from module descriptor
            VERSION=$(grep -oP "\\\$this->version\s*=\s*'\K[^']+" core/modules/modCamt053ReaderAndLink.class.php)
          fi

          # Only a plain version string may reach sed, filenames and git below.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*([.-][A-Za-z0-9]+)*$'; then
            echo "Refusing to build: unexpected version string '$VERSION'" >&2
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Module version: $VERSION"

      - name: Stamp the version into the module descriptor
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Must run before packaging: otherwise the published zip installs a
          # module still reporting the previous (pre-release) version.
          sed -i "s/\$this->version = '[^']*'/\$this->version = '$VERSION'/" core/modules/modCamt053ReaderAndLink.class.php
          grep -n "this->version" core/modules/modCamt053ReaderAndLink.class.php

      - name: Create module package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MODULE_NAME="camt053readerandlink"
          PACKAGE_NAME="module_${MODULE_NAME}-${VERSION}"

          # Create temporary directory with module structure
          mkdir -p "build_tmp/${MODULE_NAME}"

          # Copy files excluding unnecessary ones
          rsync -av --progress . "build_tmp/${MODULE_NAME}/" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='test' \
            --exclude='build_tmp' \
            --exclude='*.zip' \
            --exclude='.tx' \
            --exclude='modulebuilder.txt' \
            --exclude='.editorconfig' \
            --exclude='.gitattributes' \
            --exclude='*.back'

          # Create ZIP file
          cd build_tmp
          zip -r "../${PACKAGE_NAME}.zip" "${MODULE_NAME}"
          cd ..

          # Cleanup
          rm -rf build_tmp

          echo "Created package: ${PACKAGE_NAME}.zip"
          ls -la "${PACKAGE_NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module_camt053readerandlink-${{ steps.version.outputs.version }}
          path: module_camt053readerandlink-${{ steps.version.outputs.version }}.zip
          retention-days: 30

      # On a `release` event github.ref is also refs/tags/v..., so this must be
      # narrowed to the tag push, otherwise it runs alongside "Upload to Release"
      # and regenerates the notes of an already published release.
      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: module_camt053readerandlink-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: module_camt053readerandlink-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version update
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Drop the stamping done for the package, otherwise switching branches
          # fails on the dirty descriptor. It is re-applied on main below.
          git checkout -- core/modules/modCamt053ReaderAndLink.class.php

          git fetch origin main:refs/remotes/origin/main
          git checkout -B main origin/main

          CURRENT_VERSION=$(grep -oP "\\\$this->version\s*=\s*'\K[^']+" core/modules/modCamt053ReaderAndLink.class.php)
          if [ "$VERSION" = "$CURRENT_VERSION" ]; then
            echo "Version already up to date ($VERSION), nothing to commit"
            exit 0
          fi

          sed -i "s/\$this->version = '[^']*'/\$this->version = '$VERSION'/" core/modules/modCamt053ReaderAndLink.class.php

          # The sed above assumes exact spacing; make a silent no-op fatal here
          # rather than letting `git commit` fail with "nothing to commit".
          if git diff --quiet core/modules/modCamt053ReaderAndLink.class.php; then
            echo "Version stamping did not change the descriptor, check its formatting" >&2
            exit 1
          fi

          git add core/modules/modCamt053ReaderAndLink.class.php
          git commit -m "chore: bump version to $VERSION"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
