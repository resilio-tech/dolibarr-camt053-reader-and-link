name: Build Dolibarr Module

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty to use module version)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get module version
        id: version
        # Never interpolate a GitHub expression straight into the shell: a tag
        # name may contain backticks, dollar-parens and semicolons, which would
        # run as code in this job. Everything goes through the environment.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          DESCRIPTOR_VERSION=$(grep -oP "\\\$this->version\s*=\s*'\K[^']+" core/modules/modCamt053ReaderAndLink.class.php)

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "${REF#refs/tags/v}" != "$REF" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="$DESCRIPTOR_VERSION"
          fi

          # Only a plain version string may reach sed, filenames and git below.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*([.-][A-Za-z0-9]+)*$'; then
            echo "Refusing to build: unexpected version string '$VERSION'" >&2
            exit 1
          fi

          # The descriptor is bumped in the pull request that prepares a release.
          if [ -z "$INPUT_VERSION" ] && [ "$VERSION" != "$DESCRIPTOR_VERSION" ]; then
            echo "Refusing to build: tag $VERSION does not match the descriptor ($DESCRIPTOR_VERSION)." >&2
            echo "Bump \$this->version in core/modules/modCamt053ReaderAndLink.class.php, then tag." >&2
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Module version: $VERSION"

      - name: Stamp the version into the module descriptor
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Must run before packaging: otherwise the published zip installs a
          # module still reporting the previous (pre-release) version.
          sed -i "s/\$this->version = '[^']*'/\$this->version = '$VERSION'/" core/modules/modCamt053ReaderAndLink.class.php
          grep -n "this->version" core/modules/modCamt053ReaderAndLink.class.php

      - name: Create module package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MODULE_NAME="camt053readerandlink"
          PACKAGE_NAME="module_${MODULE_NAME}-${VERSION}"

          # Create temporary directory with module structure
          mkdir -p "build_tmp/${MODULE_NAME}"

          # Copy files excluding unnecessary ones
          rsync -av --progress . "build_tmp/${MODULE_NAME}/" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='test' \
            --exclude='build_tmp' \
            --exclude='*.zip' \
            --exclude='.tx' \
            --exclude='modulebuilder.txt' \
            --exclude='.editorconfig' \
            --exclude='.gitattributes' \
            --exclude='*.back'

          # Create ZIP file
          cd build_tmp
          zip -r "../${PACKAGE_NAME}.zip" "${MODULE_NAME}"
          cd ..

          # Cleanup
          rm -rf build_tmp

          echo "Created package: ${PACKAGE_NAME}.zip"
          ls -la "${PACKAGE_NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module_camt053readerandlink-${{ steps.version.outputs.version }}
          path: module_camt053readerandlink-${{ steps.version.outputs.version }}.zip
          retention-days: 30

      # On a `release` event github.ref is also refs/tags/v..., so this must be
      # narrowed to the tag push, otherwise it runs alongside "Upload to Release"
      # and regenerates the notes of an already published release.
      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: module_camt053readerandlink-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: module_camt053readerandlink-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
